<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* ===== LIGHT THEME (Instagram light mode) — edit here to re-theme ===== */
    --bg: #fafafa;       /* page background */
    --card: #ffffff;     /* cards / light surfaces */
    --text: #262626;     /* primary text */
    --muted: #8e8e8e;    /* secondary text */
    --border: #dbdbdb;   /* hairlines */
    --accent: #8f6239;   /* tool brand brown — never inside the IG previews */
    --accent2: #6b4423;
    --ig-blue: #0095f6;  /* IG active dot / link blue */
    --ig-red: #ff3040;   /* IG like red */
    --ig-link: #4db5f9;  /* IG hashtag/link blue */
    /* surfaces that stay dark by design (authentic IG): */
    --ink: #000;         /* fullscreen viewer shell + video/media backing */
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .insta-app {
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #000;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sheep-icon {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 48px 24px;
    text-align: center;
    margin-bottom: 32px;
    transition: all 0.3s;
    cursor: pointer;
    background: var(--card);
  }

  .reel-viewer .sz-top { top: 0; left: 0; right: 0; height: 90px; }

  .carousel-viewer .sz-bottom { left: 0; right: 0; bottom: 0; height: 140px; }
  /* on the white carousel viewer, deepen the dashed border + label for legibility */

  /* ===== CAROUSEL POST VIEWER (light — IG light-mode post detail) ===== */
  .carousel-viewer {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--card);
    color: var(--text);
    display: flex;
    flex-direction: column;

  .carousel-viewer-header {

  .carousel-viewer-header .safezone-toggle {
    margin-left: auto;
    background: rgba(0,0,0,0.05);

  }
  .carousel-viewer-header .more-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .carousel-viewer-header .more-btn svg { width: 24px; height: 24px; }
  .carousel-viewer-media {
    position: relative;
    flex: 1;
    background: var(--ink); /* media backing stays black */
    overflow: hidden;
    display: block; /* not flex: sibling buttons must never squeeze the media */
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
  }
  .carousel-viewer-media > img, .carousel-viewer-media > video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ===== CAROUSEL SWIPE TRACK (smooth slide transitions) ===== */
  .carousel-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.35s ease;
    will-change: transform;
  }
  .carousel-slide {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    position: relative;
  }
  .carousel-slide img, .carousel-slide video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none; /* swipe gestures belong to the container */
  }
  .carousel-viewer-media .carousel-slide img,
  .carousel-viewer-media .carousel-slide video {
    object-fit: contain;
  }

  /* ===== DARK MODE + AUTH ===== */

  .theme-btn, .auth-btn {

    align-items: center;
    justify-content: center;

  .auth-card {
    width: min(420px, 100%);
    padding: 30px;

    border-radius: 20px;

  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; }
  .auth-field input {
    width: 100%;
    padding: 12px 13px;

    background: var(--bg);

  }
  .auth-field input:focus { border-color: var(--accent); }
  .auth-primary {
    width: 100%;
    padding: 12px;

  }

  .auth-switch { margin-top: 15px; text-align: center; font-size: 13px; color: var(--muted); }
  .auth-switch button { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; }
  .auth-message { min-height: 20px; margin-top: 12px; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .auth-message.error { color: #ef4444; }
  .auth-message.success { color: #22c55e; }
  body.auth-locked #app { filter: blur(5px); pointer-events: none; user-select: none; }

  /* Preserve the complete carousel artwork in the opened Client View.

  .carousel-viewer-media .carousel-slide img,

  /* ===== PHASE A.1 REFINEMENTS ===== */
  .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
  .brand-copy { display:flex; flex-direction:column; line-height:1.05; }
  .brand-preview { display:none; margin-top:4px; font:500 10px/1.1 system-ui,-apple-system,sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .client-view .brand-name { font-size:15px; }
  .client-view .brand-preview { display:block; }
  .shepherd-theme-toggle { width:40px; height:40px; min-height:40px; padding:0; border-radius:999px; position:relative; }
  /* Self-contained inline SVG icons. No emoji, icon font, external file, or SVG <use> reference. */
  .theme-icon {
    width:20px;
    height:20px;
    display:block;
    position:absolute;
    left:50%;
    top:50%;
    color:currentColor;
    pointer-events:none;
    overflow:visible;
    transition:opacity .18s ease, transform .22s ease;
  }
  .theme-icon-sun {
    opacity:1;
    transform:translate(-50%,-50%) rotate(0deg) scale(1);
  }
  .theme-icon-moon {
    opacity:0;
    transform:translate(-50%,-50%) rotate(-18deg) scale(.78);
  }
  .shepherd-theme-toggle.is-dark .theme-icon-sun {
    opacity:0;
    transform:translate(-50%,-50%) rotate(18deg) scale(.78);
  }
  .shepherd-theme-toggle.is-dark .theme-icon-moon {
    opacity:1;
    transform:translate(-50%,-50%) rotate(0deg) scale(1);
  }
  .shepherd-theme-toggle:hover .theme-icon-sun {
    transform:translate(-50%,-50%) rotate(8deg) scale(1.04);
  }
  .shepherd-theme-toggle.is-dark:hover .theme-icon-sun {
    transform:translate(-50%,-50%) rotate(18deg) scale(.78);
  }
  .shepherd-theme-toggle.is-dark:hover .theme-icon-moon {
    transform:translate(-50%,-50%) rotate(-6deg) scale(1.04);
  }

  .client-back-btn { display:none; align-items:center; gap:8px; position:fixed; z-index:1200; top:14px; left:16px; min-height:38px; padding:8px 12px; border:1px solid var(--border); border-radius:999px; background:color-mix(in srgb, var(--card) 92%, transparent); color:var(--text); font:600 13px/1 system-ui,-apple-system,sans-serif; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .client-back-btn.is-visible { display:inline-flex; }
  .client-back-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .client-back-btn:hover { background:var(--card); transform:translateY(-1px); }
  .client-back-btn:focus-visible { outline:2px solid var(--ig-blue); outline-offset:2px; }

    .carousel-viewer { width:min(470px, calc(100vw - 48px)); height:min(820px, 90vh); border-radius:4px; box-shadow:0 24px 80px rgba(0,0,0,.42); animation:viewerOpen .18s cubic-bezier(.2,.75,.3,1) both; }

    .reel-viewer { width:min(430px, calc(100vw - 48px)); height:min(820px, 90vh); border-radius:10px; box-shadow:0 24px 80px rgba(0,0,0,.5); animation:viewerOpen .18s cubic-bezier(.2,.75,.3,1) both; }
  }
  @keyframes viewerOpen { from{opacity:0; transform:scale(.975) translateY(8px)} to{opacity:1; transform:scale(1) translateY(0)} }
  @keyframes viewerBackdrop { from{background:rgba(0,0,0,0)} to{background:rgba(0,0,0,.82)} }

  /* ===== PHASE A.2 — UPLOAD, VIEWER FEED & RELIABILITY ===== */
  .upload-zone.uploading { cursor: progress; border-style: solid; }
  .upload-zone.uploading > svg,
  .upload-zone.uploading > p { opacity: .28; }
  .upload-progress {
    display: none;
    width: min(560px, 100%);
    margin: 18px auto 0;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    text-align: left;
  }
  .upload-zone.uploading .upload-progress { display: block; }
  .upload-progress-copy { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; color:var(--text); }
  .upload-progress-actions { display:flex; align-items:center; gap:10px; flex:0 0 auto; }

  .upload-cancel-btn {
    min-height:28px; padding:5px 10px; border:1px solid var(--border); border-radius:999px;
    background:var(--card); color:var(--text); font:600 11px/1 system-ui,-apple-system,sans-serif; cursor:pointer;
    transition:background .16s ease,color .16s ease,border-color .16s ease,opacity .16s ease;
  }
  .upload-cancel-btn:hover:not(:disabled) { background:#ed4956; color:#fff; border-color:#ed4956; }
  .upload-cancel-btn:disabled { opacity:.42; cursor:default; }
  .upload-progress-track { height:6px; margin-top:10px; overflow:hidden; border-radius:999px; background:var(--border); }
  .upload-progress-fill { width:0%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .18s ease; }
  .upload-progress-file { min-height:16px; margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:11px; }

  .creator-delete-btn {
    width:32px; height:32px; padding:0; margin-left:2px; display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
  }
  .creator-delete-btn svg { width:16px; height:16px; }
  .creator-delete-btn:hover { color:#fff; background:#ed4956; border-color:#ed4956; transform:scale(1.04); }
  .post-header .header-more-btn { margin-left:0; }

  .grid-cell { background:var(--border); }
  .grid-cell::before {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(100deg,var(--border) 20%,color-mix(in srgb,var(--card) 70%,var(--border)) 40%,var(--border) 60%);
    background-size:220% 100%; animation:gridSkeleton 1.25s linear infinite; opacity:1; transition:opacity .2s ease;
  }
  .grid-cell.media-loaded::before { opacity:0; }
  .grid-cell > img,.grid-cell > video,.grid-cell > .video-thumb-placeholder { position:relative; z-index:1; }
  .video-thumb-placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:linear-gradient(145deg,#161616,#323232); color:#fff; font-size:11px; }
  .video-thumb-placeholder svg { width:28px; height:28px; }
  @keyframes gridSkeleton { to { background-position:-220% 0; } }

  .post-viewer { opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .post-viewer.active { display:block; opacity:1; pointer-events:auto; }
  .post-viewer.preparing { opacity:0; }
  .post-viewer.is-closing { opacity:0; pointer-events:none; }
  .post-viewer-inner.viewer-feed {
    width:100%; height:100%; max-width:none; max-height:none; display:block; overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .post-viewer-inner.viewer-feed::-webkit-scrollbar { display:none; }
  .viewer-feed-item {
    min-height:100%; width:100%; display:flex; align-items:center; justify-content:center; position:relative;
    padding:5vh 24px; scroll-snap-align:start; scroll-snap-stop:always;
  }
  .viewer-feed-item .carousel-viewer,
  .viewer-feed-item .reel-viewer { flex:0 0 auto; }
  .viewer-feed-position {
    position:absolute; right:12px; top:50%; transform:translateY(-50%); z-index:60; color:rgba(255,255,255,.7);
    font-size:10px; font-variant-numeric:tabular-nums; text-shadow:0 1px 4px rgba(0,0,0,.7); pointer-events:none;
  }
  .viewer-transition-target { transition:opacity .12s ease; }
  .viewer-transition-clone {
    position:fixed; z-index:10050; margin:0; padding:0; overflow:hidden; pointer-events:none; background:#000;
    object-fit:cover; box-shadow:0 18px 60px rgba(0,0,0,.35);
    transition:top .28s cubic-bezier(.2,.78,.2,1),left .28s cubic-bezier(.2,.78,.2,1),width .28s cubic-bezier(.2,.78,.2,1),height .28s cubic-bezier(.2,.78,.2,1),border-radius .28s ease,opacity .16s ease;
  }
  .viewer-neighbour-hint {
    position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:10020; padding:6px 10px; border-radius:999px;
    color:rgba(255,255,255,.72); background:rgba(0,0,0,.28); backdrop-filter:blur(8px); font-size:10px; pointer-events:none;
    opacity:0; animation:viewerHint 2.1s ease .45s both;
  }
  @keyframes viewerHint { 0%{opacity:0;transform:translate(-50%,6px)} 20%,70%{opacity:1;transform:translate(-50%,0)} 100%{opacity:0} }

  /* Global audio state is represented consistently on every video slide. */
  .carousel-video-mute,.reel-viewer-mute { transition:transform .16s ease,background .16s ease; }
  .carousel-video-mute:active,.reel-viewer-mute:active { transform:scale(.92); }

  /* Client utility bars hide while scrolling down and return on pull-down/up-scroll. */
  .client-view .header,
  .client-view .ig-mobile-topbar,
  .client-view .client-back-btn { transition:transform .24s cubic-bezier(.2,.75,.3,1),opacity .2s ease; will-change:transform; }
  .client-view .header { position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .client-view.client-nav-hidden .header,
  .client-view.client-nav-hidden .ig-mobile-topbar { transform:translateY(calc(-100% - 8px)); }
  .client-view.client-nav-hidden .client-back-btn { transform:translateY(-70px); opacity:0; }

  @media (prefers-reduced-motion:reduce) {

  }

  /* ===== MOBILE WIDTH CONTAINMENT =====
   * Keep profile rows, horizontal highlights and the full-screen viewer inside
   * the visual viewport. Grid items default to min-width:auto, which allowed
   * the highlight row's full content width to widen the entire page on phones.
   */
  html, body { max-width:100%; overflow-x:hidden; }
  @supports (overflow:clip) {
    html, body { overflow-x:clip; }

    .profile-actions { width:auto; }

  }


  /* ===== CAROUSEL COLOUR-FIDELITY FIX =====

<script>
  let posts = [];

  let clientMode = false;
  let nextId = 1;

  let viewerCarouselVideos = {};

  /* ============================================================
   * STORAGE — all persistence lives in this section.
   *
   * WHERE YOUR DATA IS NOW:
   *   Browser localStorage, key "sns_studio_posts", scoped to this
   *   file's origin. Inspect it via DevTools → Application →
   *   Local Storage. Nothing leaves your machine.
   *
   * TO REROUTE (your own backend, IndexedDB, a JSON file, etc.):
   *   Only replace savePosts() and loadPosts() below. Everything
   *   else in the app calls these two functions — no other code
   *   touches storage directly.
   *   Note: localStorage caps at ~5 MB per origin, so large videos
   *   (stored as base64 data URLs) may not fit; a backend swap is
   *   the right move for heavy media.
   * ============================================================ */
  const STORAGE_KEY = 'sns_studio_posts'; // legacy key; no longer used for media

  async function savePosts() {
    const persistentPosts = posts.filter(post => !post.isDemo);
    if (persistentPosts.length === 0) return;

    const rows = persistentPosts.map(post => ({
      id: post.id,
      data: post,
      updated_at: new Date().toISOString()
    }));

    const { error } = await supabaseClient
      .from('sns_posts')
      .upsert(rows, { onConflict: 'id' });

    if (error) {
      console.error('savePosts failed:', error);
      alert('Could not save this post to Supabase: ' + error.message);
    }
  }

  async function loadPosts() {
    if (Array.isArray(window.__EXPORTED_POSTS__)) {
      const exported = window.__EXPORTED_POSTS__;
      nextId = exported.reduce((max, post) => Math.max(max, Number(post.id) || 0), 0) + 1;
      return exported;
    }

    const { data, error } = await supabaseClient
      .from('sns_posts')
      .select('id, data')
      .order('id', { ascending: false });

    if (error) {
      console.error('loadPosts failed:', error);
      alert('Could not load posts from Supabase: ' + error.message);
      return [...demoPosts];
    }

    const saved = (data || []).map(row => row.data).filter(Boolean);
    if (saved.length > 0) {
      nextId = saved.reduce((max, post) => Math.max(max, Number(post.id) || 0), 0) + 1;
      return saved;
    }

    return [...demoPosts];
  }

  function safeFileName(name) {
    return String(name || 'upload')
      .normalize('NFKD')
      .replace(/[^a-zA-Z0-9._-]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'upload';
  }

  async function createVideoThumbnail(file) {
    return new Promise((resolve) => {
      const video = document.createElement('video');
      const objectUrl = URL.createObjectURL(file);
      video.muted = true;
      video.playsInline = true;
      video.preload = 'metadata';

      const cleanup = () => URL.revokeObjectURL(objectUrl);
      const fail = () => { cleanup(); resolve(null); };

      video.onerror = fail;
      video.onloadedmetadata = () => {
        const target = Number.isFinite(video.duration) && video.duration > 0
          ? Math.min(0.35, Math.max(0.05, video.duration * 0.08))
          : 0.1;
        try { video.currentTime = target; } catch (_) { fail(); }
      };
      video.onseeked = () => {
        try {
          const maxWidth = 720;
          const scale = Math.min(1, maxWidth / Math.max(1, video.videoWidth));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
          canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
          canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => {
            cleanup();
            if (!blob) return resolve(null);
            resolve(new File([blob], `thumbnail-${Date.now()}.jpg`, { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.82);
        } catch (_) { fail(); }
      };
      video.src = objectUrl;
    });
  }

  async function uploadMediaFile(file) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) throw new Error('Please sign in before uploading.');

    const uniqueName = `${Date.now()}-${crypto.randomUUID()}-${safeFileName(file.name)}`;
    const path = `${user.id}/posts/${uniqueName}`;

    const { data, error } = await supabaseClient.storage
      .from(SUPABASE_BUCKET)
      .upload(path, file, {
        cacheControl: '3600',
        contentType: file.type || undefined,
        upsert: false
      });

    if (error) throw error;

    const { data: publicData } = supabaseClient.storage
      .from(SUPABASE_BUCKET)
      .getPublicUrl(data.path);

    let thumbnailUrl = null;
    let thumbnailPath = null;
    if (file.type.startsWith('video/')) {
      const thumbnailFile = await createVideoThumbnail(file);
      if (thumbnailFile) {
        thumbnailPath = `${user.id}/thumbnails/${Date.now()}-${crypto.randomUUID()}.jpg`;
        const { data: thumbData, error: thumbError } = await supabaseClient.storage
          .from(SUPABASE_BUCKET)
          .upload(thumbnailPath, thumbnailFile, {
            cacheControl: '3600',
            contentType: 'image/jpeg',
            upsert: false
          });
        if (!thumbError) {
          const { data: thumbPublic } = supabaseClient.storage
            .from(SUPABASE_BUCKET)
            .getPublicUrl(thumbData.path);
          thumbnailUrl = thumbPublic.publicUrl;
          thumbnailPath = thumbData.path;
        } else {
          console.warn('Thumbnail upload failed:', thumbError);
          thumbnailPath = null;
        }
      }
    }

    return {
      url: publicData.publicUrl,
      path: data.path,
      thumbnailUrl,
      thumbnailPath,
      mediaType: file.type.startsWith('video/') ? 'video' : 'image'
    };
  }

  function getPostStoragePaths(post) {
    const paths = [];
    if (post.storagePath) paths.push(post.storagePath);
    if (post.thumbnailStoragePath) paths.push(post.thumbnailStoragePath);
    if (Array.isArray(post.slides)) {
      post.slides.forEach(slide => {
        if (slide && slide.storagePath) paths.push(slide.storagePath);
        if (slide && slide.thumbnailPath) paths.push(slide.thumbnailPath);
      });
    }
    return paths;
  }

  /* ===== CLIENT VIEW: Instagram profile page ===== */

  function renderGridCell(post) {
    let media = '';
    let badge = '';

    if (post.type === 'reel') {
      const hasVideo = post.videoUrl && post.videoUrl !== '';
      const hasRealThumbnail = post.thumbnail && post.thumbnail !== post.videoUrl;
      media = hasRealThumbnail
        ? `<img src="${post.thumbnail}" alt="reel thumbnail" loading="lazy">`
        : (hasVideo
          ? `<video src="${post.videoUrl}" muted playsinline preload="auto" onloadeddata="primeVideoPreview(this)"></video>`
          : `<img src="${post.thumbnail}" alt="reel" loading="lazy">`);
      badge = `
        <div class="grid-views">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          ${post.views || ''}

    } else {
      const first = post.slides[0];

      const type = typeof first === 'object' ? first.type : 'image';
      media = type === 'video'
        ? `<video src="${url}" muted playsinline preload="metadata"></video>`
        : `<img src="${url}" alt="post" loading="lazy">`;

    return `<div class="grid-cell" onclick="openViewer(${post.id})">${media}${badge}</div>`;

    const viewerInner = document.getElementById('viewerInner');
    viewerInner.innerHTML = '';

    if (post.type === 'reel') {
      viewerInner.innerHTML = renderReelViewer(post);
      setTimeout(() => initReelViewerVideo(post), 50);
    } else {
      viewerInner.innerHTML = renderCarouselViewer(post);
      setTimeout(() => initCarouselViewerVideo(post), 50);
    }

    document.getElementById('postViewer').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function renderCarouselViewer(post) {

      `<div class="dot ${i === post.currentSlide ? 'active' : ''}"></div>`
    ).join('');

      return `<div class="carousel-slide">${type === 'video'
        ? `<video src="${url}" loop playsinline muted preload="metadata"></video>`

    return `

  function currentViewerCarouselVideo() {
    const post = posts.find(p => p.id === viewerPostId);
    if (!post) return null;
    const slides = document.querySelectorAll('#viewer-track .carousel-slide');
    const slideEl = slides[post.currentSlide];
    return slideEl ? slideEl.querySelector('video') : null;
  }

  // Play the active slide's video, pause/rewind the rest, sync overlay + mute visibility
  function syncViewerCarouselMedia() {
    const post = posts.find(p => p.id === viewerPostId);
    const track = document.getElementById('viewer-track');
    if (!post || !track) return;
    track.querySelectorAll('.carousel-slide').forEach((slideEl, i) => {
      const v = slideEl.querySelector('video');
      if (!v) return;
      if (i === post.currentSlide) {
        v.play().catch(() => {});
      } else {
        v.pause();
        v.currentTime = 0;
      }
    });
    const overlay = document.getElementById('carousel-video-play');
    const muteBtn = document.getElementById('carousel-video-mute');
    const currentVideo = currentViewerCarouselVideo();
    if (overlay) {
      overlay.style.display = currentVideo ? 'flex' : 'none';
      const icon = overlay.querySelector('svg');
      if (icon) icon.style.display = currentVideo && currentVideo.paused ? 'block' : 'none';
    }
    if (muteBtn) muteBtn.style.display = currentVideo ? 'flex' : 'none';
  }

  function initCarouselViewerVideo(post) {
    syncViewerCarouselMedia();
  }

  function viewerCarouselTogglePlay() {
    if (Date.now() - lastSwipeAt < 700) return; // ignore ghost tap after a swipe
    const video = currentViewerCarouselVideo();
    if (!video) return;
    const icon = document.querySelector('#carousel-video-play svg');
    if (video.paused) {
      video.play().catch(() => {});
      if (icon) icon.style.display = 'none';
    } else {
      video.pause();
      if (icon) icon.style.display = 'block';
    }
  }

  function viewerCarouselToggleMute() {
    const video = currentViewerCarouselVideo();
    const btn = document.getElementById('carousel-video-mute');
    if (!video || !btn) return;
    video.muted = !video.muted;
    if (video.muted) {
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
    } else {
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    }
  }

  function viewerCarouselGo(dir) {
    const post = posts.find(p => p.id === viewerPostId);
    if (!post || post.slides.length <= 1) return;
    post.currentSlide = (post.currentSlide + dir + post.slides.length) % post.slides.length;
    savePosts();
    const track = document.getElementById('viewer-track');
    if (track) track.style.transform = `translateX(-${post.currentSlide * 100}%)`;
    document.querySelectorAll('.carousel-viewer-dots .dot').forEach((d, i) =>
      d.classList.toggle('active', i === post.currentSlide));
    const counter = document.getElementById('viewer-slide-counter');
    if (counter) counter.textContent = `${post.currentSlide + 1}/${post.slides.length}`;
    syncViewerCarouselMedia();
  }

  function viewerCarouselNextSlide() {
    viewerCarouselGo(1);
  }

  function viewerCarouselPrevSlide() {
    viewerCarouselGo(-1);
  }

  function initReelViewerVideo(post) {
    const video = document.getElementById('viewer-reel-video');
    if (!video) return;
    viewerVideoRef = video;
    video.addEventListener('timeupdate', viewerReelUpdateProgress);
    video.addEventListener('ended', viewerReelOnEnded);
    video.addEventListener('loadedmetadata', viewerReelUpdateDuration);
    video.play().catch(() => {});
  }

  function viewerReelTogglePlay() {
    const video = document.getElementById('viewer-reel-video');
    const overlay = document.getElementById('reel-play-overlay');
    if (!video) return;
    if (video.paused) {
      video.play();
      if (overlay) overlay.style.display = 'none';
    } else {
      video.pause();
      if (overlay) overlay.style.display = 'flex';
    }
  }

  function viewerReelToggleLike(btn) {
    const svg = btn.querySelector('svg');
    const isLiked = svg.getAttribute('fill') === 'currentColor';
    svg.setAttribute('fill', isLiked ? 'none' : 'currentColor');
    svg.style.stroke = isLiked ? 'currentColor' : '#ff3040';
    svg.style.fill = isLiked ? 'none' : '#ff3040';
  }

  function viewerReelUpdateProgress() {
    const video = document.getElementById('viewer-reel-video');
    const progress = document.getElementById('reel-progress');
    if (!video || !progress || isNaN(video.duration)) return;
    const pct = (video.currentTime / video.duration) * 100;
    progress.style.width = pct + '%';
  }

  function viewerReelUpdateDuration() {}

  function viewerReelOnEnded() {
    const overlay = document.getElementById('reel-play-overlay');
    if (overlay) overlay.style.display = 'flex';
  }

  function viewerReelSeek(event) {
    const video = document.getElementById('viewer-reel-video');
    const bar = event.currentTarget;
    if (!video || !bar || isNaN(video.duration)) return;
    const rect = bar.getBoundingClientRect();
    const pct = (event.clientX - rect.left) / rect.width;
    video.currentTime = pct * video.duration;
  }

  function viewerReelToggleMute() {
    const video = document.getElementById('viewer-reel-video');
    const btn = document.getElementById('viewer-reel-mute');
    if (!video || !btn) return;
    video.muted = !video.muted;
    if (video.muted) {
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
    } else {
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    }
  }


  function closeViewer() {
    if (viewerVideoRef) {
      viewerVideoRef.pause();
      viewerVideoRef.removeEventListener('timeupdate', viewerReelUpdateProgress);
      viewerVideoRef.removeEventListener('ended', viewerReelOnEnded);
      viewerVideoRef.removeEventListener('loadedmetadata', viewerReelUpdateDuration);
      viewerVideoRef = null;
    }
    Object.values(viewerCarouselVideos).forEach(v => {
      if (v) { v.pause(); v.src = ''; }
    });
    viewerCarouselVideos = {};
    document.getElementById('postViewer').classList.remove('active');
    document.body.style.overflow = '';
    viewerPostId = null;
  }

  // ===== EXISTING FUNCTIONS =====
  function togglePlay(id) {
    const video = document.getElementById('video-' + id);
    const playOverlay = document.getElementById('play-' + id);
    const playIcon = document.getElementById('play-icon-' + id);
    if (!video) return;
    if (video.paused) {
      video.play();
      videoRefs[id].playing = true;
      if (playOverlay) playOverlay.style.display = 'none';
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    } else {
      video.pause();
      videoRefs[id].playing = false;
      if (playOverlay) playOverlay.style.display = 'flex';
      if (playIcon) playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }
  }

  function toggleMute(id) {
    const video = document.getElementById('video-' + id);
    const btn = document.getElementById('mute-' + id);
    if (!video || !btn) return;
    video.muted = !video.muted;
    videoRefs[id].muted = video.muted;
    if (video.muted) {
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
    } else {

  /* ===== TOUCH SWIPE (mobile carousel navigation) ===== */
  const SWIPE_THRESHOLD = 50;   // px of horizontal travel needed
  let swipeStartX = 0;
  let swipeStartY = 0;
  let lastSwipeAt = 0;          // suppresses the ghost click that follows a swipe

  function swipeStart(e) {
    const t = e.touches[0];
    swipeStartX = t.clientX;
    swipeStartY = t.clientY;
  }

  function swipeDirection(e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeStartX;
    const dy = t.clientY - swipeStartY;
    // must be clearly horizontal, not a scroll
    if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5) {
      lastSwipeAt = Date.now();
      return dx < 0 ? 'left' : 'right';
    }
    return null;
  }

  function carouselSwipeEnd(e, id) {
    const dir = swipeDirection(e);
    if (!dir) return;
    e.preventDefault(); // stop the synthetic click (prevents viewer opening on swipe in client view)
    if (dir === 'left') nextSlide(id);
    else prevSlide(id);
  }

  function viewerSwipeEnd(e) {
    const dir = swipeDirection(e);
    if (!dir) return;
    e.preventDefault(); // stop the synthetic click
    if (dir === 'left') viewerCarouselNextSlide();
    else viewerCarouselPrevSlide();
  }

  /* ===== EXPORT CLIENT BUILD (ZIP package) =====
   * Downloads a .zip containing index.html + media/ files.
   * Uploaded media (base64 data URLs) is extracted into real files and
   * referenced by relative paths, so the HTML stays small and fast —
   * a 50MB single-file build chokes browsers; a folder does not.
   * Deploy: unzip, drag the folder onto Netlify Drop (or any static host).
   * (When Option 3 lands, this becomes "Publish" via the STORAGE swap.) */
  const EXPORT_MIME_EXT = {
    'video/mp4': '.mp4', 'video/quicktime': '.mov', 'video/webm': '.webm',
    'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/gif': '.gif'
  };

  function dataUrlToBytes(dataUrl) {
    const comma = dataUrl.indexOf(',');
    const mime = dataUrl.slice(5, comma).split(';')[0];
    const bin = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { mime, bytes };
  }

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // Minimal ZIP writer (STORE method — media is already compressed)
  function buildZip(entries) {
    const enc = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;
    entries.forEach(e => {
      const nameBytes = enc.encode(e.name);
      const crc = crc32(e.bytes);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); // UTF-8 names
      lh.setUint32(14, crc, true);
      lh.setUint32(18, e.bytes.length, true); lh.setUint32(22, e.bytes.length, true);
      lh.setUint16(26, nameBytes.length, true);
      chunks.push(new Uint8Array(lh.buffer), nameBytes, e.bytes);
      central.push({ nameBytes, crc, size: e.bytes.length, offset });
      offset += 30 + nameBytes.length + e.bytes.length;
    });
    const cdStart = offset;
    central.forEach(c => {
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, c.crc, true);
      ch.setUint32(20, c.size, true); ch.setUint32(24, c.size, true);
      ch.setUint16(28, c.nameBytes.length, true);
      ch.setUint32(42, c.offset, true);
      chunks.push(new Uint8Array(ch.buffer), c.nameBytes);
      offset += 46 + c.nameBytes.length;
    });
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, offset - cdStart, true); eocd.setUint32(16, cdStart, true);
    chunks.push(new Uint8Array(eocd.buffer));
    return new Blob(chunks, { type: 'application/zip' });
  }

  function exportClientBuild() {
    // 1) clone posts, extracting data-URL media into real files
    const files = [];
    const cache = {};
    let counter = 0;
    const extract = (url) => {
      if (typeof url !== 'string' || !url.startsWith('data:')) return url;
      if (cache[url]) return cache[url];
      const { mime, bytes } = dataUrlToBytes(url);
      const name = 'media/media-' + (++counter) + (EXPORT_MIME_EXT[mime] || '.bin');
      files.push({ name, bytes });
      cache[url] = name;
      return name;
    };
    const cloned = JSON.parse(JSON.stringify(posts));
    cloned.forEach(p => {
      if (p.videoUrl) p.videoUrl = extract(p.videoUrl);
      if (p.thumbnail) p.thumbnail = extract(p.thumbnail);
      if (Array.isArray(p.slides)) {
        p.slides = p.slides.map(s =>
          (s && typeof s === 'object' && s.url)
            ? Object.assign({}, s, { url: extract(s.url) })
            : extract(s));
      }
    });

    // 2) build the HTML snapshot with the (now small) posts baked in
    // NOTE: needle/tag strings are built by concatenation so this
    // function's own source never contains a literal script-open or
    // body-close tag — otherwise the replaces below would match inside
    // the script text and corrupt the exported file.
    const OPEN_SCRIPT = '<scr' + 'ipt>';
    const CLOSE_BODY = '</bo' + 'dy>';
    const injector =
      '<scr' + 'ipt>window.__EXPORTED_POSTS__=' +
      JSON.stringify(cloned).replace(/</g, '\\u003c') +
      ';</scr' + 'ipt>';
    const hardHide =
      '<style>.upload-zone,.tabs,.header-actions{display:none!important}</style>';
    const forceClient =
      '<scr' + 'ipt>(function(){' +
      'try{if(!clientMode)toggleClientMode();}catch(e){' +
      'var app=document.getElementById("app");if(app)app.classList.add("client-view");}' +
      '})();</scr' + 'ipt>';

    // Strip the live-rendered gallery before serializing — its markup
    // contains full data-URL copies of every media item. The exported
    // app re-renders from the baked posts on boot anyway.
    const galleryEl = document.getElementById('gallery');
    if (galleryEl) galleryEl.innerHTML = '';
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    if (galleryEl) renderGallery();
    html = html.replace(OPEN_SCRIPT, injector + '\n' + OPEN_SCRIPT); // seed storage before app boots
    html = html.replace(CLOSE_BODY, hardHide + '\n' + forceClient + '\n' + CLOSE_BODY);

    // 3) package index.html + media into a zip
    files.unshift({ name: 'index.html', bytes: new TextEncoder().encode(html) });
    const zip = buildZip(files);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zip);
    a.download = 'shepherd-sns-client-build.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  async function handleFiles(files) {
    const fileArray = Array.from(files);
    if (fileArray.length === 0) return;

    const uploadZone = document.getElementById('uploadZone');
    uploadZone.classList.add('dragover');

    try {
      const items = await Promise.all(fileArray.map(uploadMediaFile));
      const images = items.filter(item => item.mediaType === 'image');
      const videos = items.filter(item => item.mediaType === 'video');
      const id = Date.now();

      if (videos.length === 1 && images.length === 0) {
        posts.unshift({
          id,
          type: 'reel',
          username: 'yourbrand',
          avatar: 'YB',
          thumbnail: videos[0].thumbnailUrl || videos[0].url,
          thumbnailStoragePath: videos[0].thumbnailPath || null,
          videoUrl: videos[0].url,
          storagePath: videos[0].path,
          caption: '',
          likes: Math.floor(Math.random() * 5000) + 500,
          views: (Math.random() * 50 + 5).toFixed(1) + 'K',
          isDemo: false
        });
      } else {
        const allSlides = items.map(item => ({
          url: item.url,
          type: item.mediaType,
          storagePath: item.path,
          thumbnailUrl: item.thumbnailUrl || null,
          thumbnailPath: item.thumbnailPath || null
        }));

        if (allSlides.length > 0) {
          posts.unshift({
            id,
            type: 'carousel',
            username: 'yourbrand',
            avatar: 'YB',
            slides: allSlides,
            currentSlide: 0,
            caption: '',
            likes: Math.floor(Math.random() * 3000) + 500,
            isDemo: false
          });
        }
      }

      nextId = Math.max(nextId, id + 1);
      await savePosts();
      renderGallery();
      document.getElementById('fileInput').value = '';
    } catch (error) {
      console.error('Upload failed:', error);
      alert('Upload failed: ' + (error.message || error));
    } finally {
      uploadZone.classList.remove('dragover');
    }
  }

  const uploadZone = document.getElementById('uploadZone');
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  let authMode = 'login';

    el.textContent = message || '';

  function toggleAuthMode() {

    document.getElementById('authTitle').textContent = authMode === 'login' ? 'Sign in' : 'Create account';
    document.getElementById('authSubtitle').textContent = authMode === 'login'

  async function submitAuth(event) {
    event.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const submit = document.getElementById('authSubmit');
    submit.disabled = true;
    setAuthMessage(authMode === 'login' ? 'Signing in…' : 'Creating account…');

    try {
      if (authMode === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: window.location.origin }
        });
        if (error) throw error;
        if (!data.session) {
          setAuthMessage('Account created. Check your email and confirm the account, then sign in.', 'success');
          return;
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (error) {
      setAuthMessage(error.message || String(error), 'error');
    } finally {
      submit.disabled = false;
    }
  }

  async function applyAuthSession(session) {
    const overlay = document.getElementById('authOverlay');
    const signOut = document.getElementById('signOutBtn');
    const authUser = document.getElementById('authUser');

    if (!session?.user) {
      document.body.classList.add('auth-locked');
      overlay.classList.add('active');
      signOut.style.display = 'none';
      authUser.textContent = '';
      posts = [];
      const gallery = document.getElementById('gallery');
      if (gallery) gallery.innerHTML = '';
      appBooted = false;
      return;

    document.body.classList.remove('auth-locked');
    overlay.classList.remove('active');
    signOut.style.display = 'inline-flex';
    authUser.textContent = session.user.email || 'Signed in';
    setAuthMessage('');

    if (!appBooted) {
      posts = await loadPosts();
      renderGallery();
      appBooted = true;
    }
  }

  function primeVideoPreview(video) {
    try {
      video.muted = true;
      const seek = () => {
        if (Number.isFinite(video.duration) && video.duration > 0) {
          video.currentTime = Math.min(0.25, video.duration * 0.08);
        }
        video.pause();
      };
      if (video.readyState >= 2) seek();
      else video.addEventListener('loadeddata', seek, { once: true });
    } catch (_) {}
  }

  const activeUploadXhrs = new Set();

  function soundIconSvg(muted) {
    return muted
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  }

  function trashIconSvg() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>`;
  }

  function isRenderablePost(post) {
    if (!post || !post.id || !post.type) return false;
    if (post.type === 'reel') return Boolean(post.videoUrl || post.thumbnail);
    if (post.type === 'carousel') {
      return Array.isArray(post.slides) && post.slides.some(slide => {
        const url = typeof slide === 'object' ? slide?.url : slide;
        return Boolean(url);
      });
    }
    return false;
  }

  async function loadPosts(options = {}) {
    if (Array.isArray(window.__EXPORTED_POSTS__)) {
      const exported = window.__EXPORTED_POSTS__.filter(isRenderablePost);
      nextId = exported.reduce((max, post) => Math.max(max, Number(post.id) || 0), 0) + 1;
      return exported;
    }

    const { data, error } = await supabaseClient
      .from('sns_posts')
      .select('id, data')
      .order('id', { ascending: false });

    if (error) {
      console.error('loadPosts failed:', error);
      if (!options.silent) alert('Could not load posts from Supabase: ' + error.message);
      return options.keepCurrent ? posts : [...demoPosts];
    }

    const saved = (data || []).map(row => row.data).filter(isRenderablePost);
    if (saved.length > 0) {
      nextId = saved.reduce((max, post) => Math.max(max, Number(post.id) || 0), 0) + 1;
      return saved;
    }
    return [...demoPosts];
  }

  function renderGallerySkeleton() {

        <div style="aspect-ratio:4/5;background:linear-gradient(100deg,var(--border) 20%,var(--card) 40%,var(--border) 60%);background-size:220% 100%;animation:gridSkeleton 1.25s linear infinite;"></div>
      </div>`).join('');
  }

  function setUploadProgress(percent, stage, fileName = '') {
    const progress = Math.max(0, Math.min(100, Math.round(percent || 0)));
    const panel = document.getElementById('uploadProgress');
    const fill = document.getElementById('uploadProgressFill');
    const pct = document.getElementById('uploadPercent');
    const stageEl = document.getElementById('uploadStage');
    const fileEl = document.getElementById('uploadProgressFile');
    if (panel) panel.setAttribute('aria-hidden', uploadInProgress ? 'false' : 'true');
    if (fill) fill.style.width = `${progress}%`;
    if (pct) pct.textContent = `${progress}%`;
    if (stageEl && stage) stageEl.textContent = stage;
    if (fileEl) fileEl.textContent = fileName || '';
  }

  function setUploadCancelable(enabled) {
    const button = document.getElementById('uploadCancelBtn');
    if (button) button.disabled = !enabled;
  }

  function createUploadAbortError() {
    try { return new DOMException('Upload cancelled.', 'AbortError'); }
    catch (_) { const error = new Error('Upload cancelled.'); error.name = 'AbortError'; return error; }
  }

  function throwIfUploadCancelled(signal = currentUploadController?.signal) {
    if (uploadCancelRequested || signal?.aborted) throw createUploadAbortError();
  }

  function cancelCurrentUpload() {
    if (!uploadInProgress || uploadCancelRequested) return;
    uploadCancelRequested = true;
    setUploadCancelable(false);
    const percent = Number(document.getElementById('uploadPercent')?.textContent?.replace('%','')) || 0;
    setUploadProgress(percent, 'Cancelling upload…', 'Removing unfinished files');
    currentUploadController?.abort();
    activeUploadXhrs.forEach(xhr => { try { xhr.abort(); } catch (_) {} });
  }

  function resetUploadProgress() {
    const zone = document.getElementById('uploadZone');
    const input = document.getElementById('fileInput');
    uploadInProgress = false;
    uploadCancelRequested = false;
    currentUploadController = null;
    activeUploadXhrs.clear();
    zone?.classList.remove('uploading', 'dragover');
    if (input) { input.disabled = false; input.value = ''; }
    setUploadCancelable(false);
    setUploadProgress(0, 'Preparing upload…', '');
  }

  function encodedStoragePath(path) {
    return String(path).split('/').map(encodeURIComponent).join('/');
  }

  async function uploadBinaryToSupabase(path, file, onProgress, signal = currentUploadController?.signal) {
    throwIfUploadCancelled(signal);
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session?.access_token) throw new Error('Please sign in before uploading.');
    throwIfUploadCancelled(signal);

    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      let settled = false;
      const abortUpload = () => {
        try { xhr.abort(); } catch (_) {}
        finish(reject, createUploadAbortError());
      };
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        activeUploadXhrs.delete(xhr);
        signal?.removeEventListener('abort', abortUpload);
        callback(value);
      };
      const url = `${SUPABASE_URL}/storage/v1/object/${encodeURIComponent(SUPABASE_BUCKET)}/${encodedStoragePath(path)}`;
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', `Bearer ${session.access_token}`);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('x-upsert', 'false');
      xhr.setRequestHeader('cache-control', '3600');
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      activeUploadXhrs.add(xhr);
      signal?.addEventListener('abort', abortUpload, { once: true });
      xhr.upload.onprogress = event => {
        if (event.lengthComputable && typeof onProgress === 'function') onProgress(event.loaded, event.total);
      };
      xhr.onerror = () => finish(reject, new Error('Network error while uploading.'));
      xhr.onabort = () => finish(reject, createUploadAbortError());
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) return finish(resolve, path);
        let message = `Upload failed (${xhr.status}).`;
        try {
          const parsed = JSON.parse(xhr.responseText || '{}');
          message = parsed.message || parsed.error || message;
        } catch (_) {}
        finish(reject, new Error(message));
      };
      try { xhr.send(file); }
      catch (error) { finish(reject, error); }
    });
  }

  function canvasLooksBlack(ctx, width, height) {
    try {
      const sampleW = Math.min(48, width);
      const sampleH = Math.min(48, height);
      const sample = document.createElement('canvas');
      sample.width = sampleW;
      sample.height = sampleH;
      const sctx = sample.getContext('2d', { willReadFrequently: true });
      sctx.drawImage(ctx.canvas, 0, 0, width, height, 0, 0, sampleW, sampleH);
      const data = sctx.getImageData(0, 0, sampleW, sampleH).data;
      let sum = 0, sumSq = 0, count = 0;
      for (let i = 0; i < data.length; i += 16) {
        const luma = data[i] * .2126 + data[i + 1] * .7152 + data[i + 2] * .0722;
        sum += luma; sumSq += luma * luma; count++;
      }
      const mean = sum / Math.max(1, count);
      const variance = sumSq / Math.max(1, count) - mean * mean;
      return mean < 7 && variance < 18;
    } catch (_) {
      return false;
    }
  }

  function waitForVideoEvent(video, eventName, timeout = 5000, signal = currentUploadController?.signal) {
    return new Promise((resolve, reject) => {
      let timer;
      const done = () => { clearTimeout(timer); cleanup(); resolve(); };
      const fail = () => { clearTimeout(timer); cleanup(); reject(new Error(`Video ${eventName} failed.`)); };
      const aborted = () => { clearTimeout(timer); cleanup(); reject(createUploadAbortError()); };
      const cleanup = () => {
        video.removeEventListener(eventName, done);
        video.removeEventListener('error', fail);
        signal?.removeEventListener('abort', aborted);
      };
      if (signal?.aborted) return aborted();
      video.addEventListener(eventName, done, { once: true });
      video.addEventListener('error', fail, { once: true });
      signal?.addEventListener('abort', aborted, { once: true });
      timer = setTimeout(fail, timeout);
    });
  }

  async function seekVideoForThumbnail(video, time, signal = currentUploadController?.signal) {
    throwIfUploadCancelled(signal);
    if (Math.abs(video.currentTime - time) < .025 && video.readyState >= 2) return;
    const wait = waitForVideoEvent(video, 'seeked', 4500, signal);
    video.currentTime = time;
    await wait;
    throwIfUploadCancelled(signal);
    if ('requestVideoFrameCallback' in video) {
      await new Promise((resolve, reject) => {
        const aborted = () => reject(createUploadAbortError());
        signal?.addEventListener('abort', aborted, { once: true });
        video.requestVideoFrameCallback(() => { signal?.removeEventListener('abort', aborted); resolve(); });
      });
    } else {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(resolve, 90);
        const aborted = () => { clearTimeout(timer); reject(createUploadAbortError()); };
        signal?.addEventListener('abort', aborted, { once: true });
      });
    }
    throwIfUploadCancelled(signal);
  }

  async function createVideoThumbnail(file, signal = currentUploadController?.signal, mode = 'smart') {
    const video = document.createElement('video');
    const objectUrl = URL.createObjectURL(file);
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px;';
    document.body.appendChild(video);

    try {
      throwIfUploadCancelled(signal);
      const metadataReady = waitForVideoEvent(video, 'loadedmetadata', 7000, signal);
      video.src = objectUrl;
      video.load();
      await metadataReady;
      if (video.readyState < 2) await waitForVideoEvent(video, 'loadeddata', 7000, signal);
      throwIfUploadCancelled(signal);
      if (!video.videoWidth || !video.videoHeight) throw new Error('This video cannot be decoded for a thumbnail.');

      const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 1;
      // Carousel covers favour speed: decode one frame only. Reels keep the smarter
      // multi-frame scan so a fade-in or black opening is less likely to become the cover.
      const rawTargets = mode === 'fast'
        ? [Math.min(.75, Math.max(.08, duration * .08))]
        : [.35, .75, 1.25, duration * .08, duration * .2, duration * .42, duration * .65];
      const targets = [...new Set(rawTargets.map(value => Math.max(.04, Math.min(Math.max(.04, duration - .04), value)).toFixed(3)))].map(Number);
      let fallbackBlob = null;

      for (let i = 0; i < targets.length; i++) {
        await seekVideoForThumbnail(video, targets[i], signal);
        throwIfUploadCancelled(signal);
        const maxWidth = 900;
        const scale = Math.min(1, maxWidth / Math.max(1, video.videoWidth));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .86));
        if (!blob) continue;
        fallbackBlob = fallbackBlob || blob;
        if (!canvasLooksBlack(ctx, canvas.width, canvas.height)) {
          return new File([blob], `thumbnail-${Date.now()}.jpg`, { type: 'image/jpeg' });
        }
      }

      return fallbackBlob ? new File([fallbackBlob], `thumbnail-${Date.now()}.jpg`, { type: 'image/jpeg' }) : null;
    } catch (error) {
      if (error?.name === 'AbortError') throw error;
      console.warn('Thumbnail generation failed:', error);
      return null;
    } finally {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.remove();
      URL.revokeObjectURL(objectUrl);
    }
  }

  async function uploadMediaFile(file, onStatus, options = {}) {
    const { generateThumbnail = true, thumbnailMode = 'smart', signal = currentUploadController?.signal, onPath } = options;
    throwIfUploadCancelled(signal);
    const { data: { session } } = await supabaseClient.auth.getSession();
    const user = session?.user;
    if (!user) throw new Error('Please sign in before uploading.');

    const uniqueName = `${Date.now()}-${crypto.randomUUID()}-${safeFileName(file.name)}`;
    const path = `${user.id}/posts/${uniqueName}`;
    onStatus?.({ phase: 'upload', loaded: 0, total: file.size, file });
    await uploadBinaryToSupabase(path, file, (loaded, total) => onStatus?.({ phase: 'upload', loaded, total, file }), signal);
    onPath?.(path);
    throwIfUploadCancelled(signal);
    const { data: publicData } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);

    let thumbnailUrl = null;
    let thumbnailPath = null;
    if (generateThumbnail && file.type.startsWith('video/')) {
      onStatus?.({ phase: 'thumbnail', file });
      const thumbnailFile = await createVideoThumbnail(file, signal, thumbnailMode);
      throwIfUploadCancelled(signal);
      if (thumbnailFile) {
        thumbnailPath = `${user.id}/thumbnails/${Date.now()}-${crypto.randomUUID()}.jpg`;
        try {
          onStatus?.({ phase: 'thumbnailUpload', file, thumbnailFile });
          await uploadBinaryToSupabase(thumbnailPath, thumbnailFile, (loaded, total) => onStatus?.({ phase: 'thumbnailUpload', loaded, total, file, thumbnailFile }), signal);
          onPath?.(thumbnailPath);
          const { data: thumbPublic } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(thumbnailPath);
          thumbnailUrl = thumbPublic.publicUrl;
        } catch (thumbError) {
          if (thumbError?.name === 'AbortError') throw thumbError;
          console.warn('Thumbnail upload failed:', thumbError);
          thumbnailPath = null;
        }
      }
    }

    return {
      url: publicData.publicUrl,
      path,
      thumbnailUrl,
      thumbnailPath,
      mediaType: file.type.startsWith('video/') ? 'video' : 'image'
    };
  }

  async function handleFiles(files) {
    const fileArray = Array.from(files || []);
    if (!fileArray.length || uploadInProgress) return;

    const zone = document.getElementById('uploadZone');
    const input = document.getElementById('fileInput');
    const uploadedItems = [];
    const createdPaths = [];
    const isSingleVideoReel = fileArray.length === 1 && fileArray[0].type.startsWith('video/');
    uploadInProgress = true;
    uploadCancelRequested = false;
    currentUploadController = new AbortController();
    const signal = currentUploadController.signal;
    zone?.classList.add('uploading', 'dragover');
    if (input) input.disabled = true;
    setUploadCancelable(true);
    setUploadProgress(2, 'Preparing media…', `${fileArray.length} file${fileArray.length === 1 ? '' : 's'}`);

    try {
      for (let i = 0; i < fileArray.length; i++) {
        throwIfUploadCancelled(signal);
        const file = fileArray[i];
        // A Reel needs a cover. A carousel only needs a generated cover when slide 1 is a video.
        const generateThumbnail = file.type.startsWith('video/') && (isSingleVideoReel || i === 0);
        const thumbnailMode = isSingleVideoReel ? 'smart' : 'fast';
        const item = await uploadMediaFile(file, status => {
          if (status.phase === 'upload') {
            const withinFile = Math.max(0, Math.min(1, (status.loaded || 0) / Math.max(1, status.total || file.size || 1)));
            const percent = 5 + ((i + withinFile * .9) / fileArray.length) * 88;
            setUploadProgress(percent, `Uploading media ${i + 1} of ${fileArray.length}…`, file.name);
          } else if (status.phase === 'thumbnail') {
            const percent = 5 + ((i + .92) / fileArray.length) * 88;
            setUploadProgress(percent, isSingleVideoReel ? 'Finding the best Reel cover…' : 'Generating carousel cover from Slide 1…', file.name);
          } else if (status.phase === 'thumbnailUpload') {
            const percent = 5 + ((i + .97) / fileArray.length) * 88;
            setUploadProgress(percent, isSingleVideoReel ? 'Uploading Reel cover…' : 'Uploading carousel cover…', file.name);
          }
        }, {
          generateThumbnail,
          thumbnailMode,
          signal,
          onPath: path => createdPaths.push(path)
        });
        uploadedItems.push(item);
      }

      throwIfUploadCancelled(signal);
      setUploadCancelable(false);
      setUploadProgress(94, 'Saving post to Supabase…', '');
      const images = uploadedItems.filter(item => item.mediaType === 'image');
      const videos = uploadedItems.filter(item => item.mediaType === 'video');
      const id = Date.now();

      if (videos.length === 1 && images.length === 0) {
        posts.unshift({
          id, type: 'reel', username: 'yourbrand', avatar: 'YB',
          thumbnail: videos[0].thumbnailUrl || videos[0].url,
          thumbnailStoragePath: videos[0].thumbnailPath || null,
          videoUrl: videos[0].url, storagePath: videos[0].path,
          caption: '', likes: Math.floor(Math.random() * 5000) + 500,
          views: (Math.random() * 50 + 5).toFixed(1) + 'K', isDemo: false
        });
      } else {
        const allSlides = uploadedItems.map(item => ({
          url: item.url, type: item.mediaType, storagePath: item.path,
          thumbnailUrl: item.thumbnailUrl || null, thumbnailPath: item.thumbnailPath || null
        }));
        if (allSlides.length) {
          posts.unshift({
            id, type: 'carousel', username: 'yourbrand', avatar: 'YB', slides: allSlides,
            currentSlide: 0, caption: '', likes: Math.floor(Math.random() * 3000) + 500, isDemo: false
          });
        }
      }

      nextId = Math.max(nextId, id + 1);
      await savePosts();
      renderGallery();
      if (input) input.value = '';
      setUploadProgress(100, 'Upload complete', `${fileArray.length} file${fileArray.length === 1 ? '' : 's'} ready`);
      setTimeout(resetUploadProgress, 850);
    } catch (error) {
      const cancelled = error?.name === 'AbortError' || uploadCancelRequested;
      if (cancelled) console.info('Upload cancelled.');
      else console.error('Upload failed:', error);
      setUploadCancelable(false);
      if (createdPaths.length) {
        setUploadProgress(0, cancelled ? 'Cancelling upload…' : 'Cleaning up unfinished upload…', 'Removing unfinished files');
        try { await supabaseClient.storage.from(SUPABASE_BUCKET).remove([...new Set(createdPaths)]); }
        catch (cleanupError) { console.warn('Could not remove every unfinished upload:', cleanupError); }
      }
      if (cancelled) {
        setUploadProgress(0, 'Upload cancelled', 'No post was created');
        setTimeout(resetUploadProgress, 900);
      } else {
        setUploadProgress(0, 'Upload failed', error.message || String(error));
        alert('Upload failed: ' + (error.message || error));
        setTimeout(resetUploadProgress, 1800);
      }
    }
  }

  function markGridMediaLoaded(media) {
    media?.closest('.grid-cell')?.classList.add('media-loaded');
  }

  function primarySlideInfo(post) {
    const first = post?.slides?.[0];
    if (!first) return { url: '', type: 'image', thumbnailUrl: null };
    return typeof first === 'object'
      ? { url: first.url || '', type: first.type || 'image', thumbnailUrl: first.thumbnailUrl || null }
      : { url: first, type: 'image', thumbnailUrl: null };
  }

  function renderGridCell(post) {
    let media = '';
    let badge = '';
    const commonImg = `crossorigin="anonymous" loading="lazy" onerror="handleBrokenMedia(event,${post.id})"`;

    if (post.type === 'reel') {
      const hasVideo = Boolean(post.videoUrl);
      const hasRealThumbnail = post.thumbnail && post.thumbnail !== post.videoUrl;
      media = hasRealThumbnail
        ? `<img src="${post.thumbnail}" alt="reel thumbnail" ${commonImg} onload="markGridMediaLoaded(this);validateThumbnailImage(this,${post.id})">`
        : (hasVideo
          ? `<video src="${post.videoUrl}" muted playsinline preload="metadata" crossorigin="anonymous" onloadeddata="primeVideoPreview(this);markGridMediaLoaded(this)" onerror="handleBrokenMedia(event,${post.id})"></video>`
          : `<div class="video-thumb-placeholder"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg><span>Video</span></div>`);
      badge = `<div class="grid-views"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>${post.views || ''}</div>`;
    } else {
      const first = primarySlideInfo(post);
      if (first.type === 'video' && first.thumbnailUrl) {
        media = `<img src="${first.thumbnailUrl}" alt="post thumbnail" ${commonImg} onload="markGridMediaLoaded(this)">`;
      } else if (first.type === 'video') {
        media = `<video src="${first.url}" muted playsinline preload="metadata" crossorigin="anonymous" onloadeddata="primeVideoPreview(this);markGridMediaLoaded(this)" onerror="handleBrokenMedia(event,${post.id})"></video>`;
      } else {
        media = `<img src="${first.url}" alt="post" ${commonImg} onload="markGridMediaLoaded(this)">`;
      }
      if (post.slides.length > 1) {
        badge = `<div class="grid-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="14" height="14" rx="2" fill="rgba(0,0,0,0.35)"/><path d="M4 6v14a2 2 0 0 0 2 2h14"/></svg></div>`;
      }
    }

    return `<div class="grid-cell" data-post-id="${post.id}" onclick="openViewer(${post.id},this)">${media}${badge}</div>`;
  }

  function renderCarousel(post) {
    post.currentSlide = Number.isInteger(post.currentSlide) ? post.currentSlide : 0;
    const dots = post.slides.map((_, i) => `<div class="dot ${i === post.currentSlide ? 'active' : ''}"></div>`).join('');
    const slidesHtml = post.slides.map(slide => {
      const url = typeof slide === 'object' ? slide.url : slide;
      const type = typeof slide === 'object' ? slide.type : 'image';
      return `<div class="carousel-slide">${type === 'video'
        ? `<video src="${url}" loop playsinline muted preload="metadata"></video>`
        : `<img src="${url}" alt="carousel slide" loading="lazy">`}</div>`;
    }).join('');

    return `<div class="post-card" data-id="${post.id}">
      <div class="post-header">
        <div class="avatar">${post.avatar}</div><div class="post-header-info"><div class="username">${post.username}</div></div>
        ${!clientMode ? `<button class="creator-delete-btn" aria-label="Delete post" title="Delete post" onclick="event.stopPropagation();deletePost(${post.id})">${trashIconSvg()}</button>` : ''}
        <button class="header-more-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
      </div>
      <div class="media-container" ontouchstart="swipeStart(event)" ontouchend="carouselSwipeEnd(event,${post.id})">
        <div class="carousel-track" id="track-${post.id}" style="transform:translateX(-${post.currentSlide * 100}%);">${slidesHtml}</div>
        ${post.slides.length > 1 ? `<button class="carousel-nav prev" onclick="event.stopPropagation();prevSlide(${post.id})">‹</button><button class="carousel-nav next" onclick="event.stopPropagation();nextSlide(${post.id})">›</button><div class="slide-counter">${post.currentSlide + 1}/${post.slides.length}</div>` : ''}
      </div>
      <div class="post-actions">
        <button class="action-btn" onclick="event.stopPropagation();toggleLike(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <button class="action-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
        <button class="action-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        <button class="action-btn" style="margin-left:auto" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
      ${post.slides.length > 1 ? `<div class="carousel-dots">${dots}</div>` : ''}
      <div class="post-likes">${post.likes.toLocaleString()} likes</div>
      ${!clientMode ? `<textarea class="caption-input" rows="2" placeholder="Write a caption..." onclick="event.stopPropagation()" onblur="updateCaption(${post.id},this.value)">${post.caption || ''}</textarea>` : `<div class="post-caption"><span class="user">${post.username}</span>${formatCaption(post.caption || '')}</div>`}
      <div class="post-comments-link">View all 24 comments</div><div class="post-timestamp">2 hours ago</div>
    </div>`;
  }

  function renderReel(post) {
    const hasVideo = Boolean(post.videoUrl);
    const videoId = `video-${post.id}`;
    videoRefs[post.id] = { playing:false, muted:true };
    return `<div class="post-card" data-id="${post.id}">
      <div class="post-header">
        <div class="avatar">${post.avatar}</div><div class="post-header-info"><div class="username">${post.username}</div><div class="location">Original audio</div></div>
        ${!clientMode ? `<button class="creator-delete-btn" aria-label="Delete post" title="Delete post" onclick="event.stopPropagation();deletePost(${post.id})">${trashIconSvg()}</button>` : ''}
        <button class="header-more-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
      </div>
      <div class="media-container" id="media-${post.id}">
