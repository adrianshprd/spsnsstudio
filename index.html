          <div class="play-overlay" id="play-${post.id}" onclick="event.stopPropagation();togglePlay(${post.id})"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
          <button class="mute-btn" id="mute-${post.id}" onclick="event.stopPropagation();toggleMute(${post.id})">${soundIconSvg(true)}</button>
          <div class="video-controls" id="controls-${post.id}"><button onclick="event.stopPropagation();togglePlay(${post.id})"><svg viewBox="0 0 24 24" fill="currentColor" id="play-icon-${post.id}"><polygon points="5 3 19 12 5 21 5 3"/></svg></button><div class="progress-bar" onclick="event.stopPropagation();seekVideo(event,${post.id})"><div class="progress-fill" id="progress-${post.id}"></div></div><span class="time-display" id="time-${post.id}">0:00</span></div>`
          : `<img src="${post.thumbnail}" alt="reel thumbnail" loading="lazy"><div class="reel-badge"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>Reels</div>`}
      </div>
      <div class="post-actions">
        <button class="action-btn" onclick="event.stopPropagation();toggleLike(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <button class="action-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
        <button class="action-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        <button class="action-btn" style="margin-left:auto" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
      <div class="post-likes">${post.likes.toLocaleString()} likes</div>
      ${!clientMode ? `<textarea class="caption-input" rows="2" placeholder="Write a caption..." onclick="event.stopPropagation()" onblur="updateCaption(${post.id},this.value)">${post.caption || ''}</textarea>` : `<div class="post-caption"><span class="user">${post.username}</span>${formatCaption(post.caption || '')}</div>`}
      <div class="post-comments-link">View all 24 comments</div><div class="post-timestamp">2 hours ago</div>
    </div>`;
  }

  function getViewerPosts() {
    if (clientMode && profileTab === 'reels') return posts.filter(post => post.type === 'reel' && isRenderablePost(post));
    return posts.filter(isRenderablePost);
  }

  function renderViewerFeedItem(post, index, total) {
    return `<section class="viewer-feed-item" data-post-id="${post.id}">${post.type === 'reel' ? renderReelViewer(post) : renderCarouselViewer(post)}<div class="viewer-feed-position">${index + 1}/${total}</div></section>`;
  }

  function renderReelViewer(post) {
    const hasVideo = Boolean(post.videoUrl);
    const id = post.id;
    return `<div class="reel-viewer">
      <div class="reel-media-wrap viewer-transition-target">
        ${hasVideo ? `<video id="viewer-reel-video-${id}" class="reel-video" src="${post.videoUrl}" crossorigin="anonymous" loop playsinline ${globalMuted ? 'muted' : ''} preload="metadata" ontimeupdate="viewerReelUpdateProgress(${id})" onended="viewerReelOnEnded(${id})"></video><div class="reel-play-overlay" id="reel-play-overlay-${id}" onclick="viewerReelTogglePlay(${id})"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>` : `<img src="${post.thumbnail}" alt="reel" class="reel-video">`}
      </div>
      <div class="reel-overlay-gradient"></div>
      <div class="reel-topbar"><div class="reel-title">Reels</div><div class="reel-topbar-right"><span class="reel-camera-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><button class="reel-close" onclick="closeViewer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
      ${hasVideo ? `<button class="reel-viewer-mute" id="viewer-reel-mute-${id}" onclick="viewerReelToggleMute(${id})">${soundIconSvg(globalMuted)}</button>` : ''}
      <div class="reel-left-info"><div class="reel-user-row"><div class="avatar">${post.avatar}</div><span class="reel-username">${post.username}</span><button class="reel-follow-btn">Follow</button></div><div class="reel-caption-text">${formatCaption(post.caption || '')}</div><div class="reel-audio-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="reel-audio-text">${post.username} · Original audio</span></div></div>
      <div class="reel-right-actions">
        <div class="reel-action-item" onclick="viewerReelToggleLike(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="reel-action-icon"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="reel-action-label">${post.likes.toLocaleString()}</span></div>
        <div class="reel-action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="reel-action-icon"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="reel-action-label">${Math.floor(Math.random() * 500 + 50)}</span></div>
        <div class="reel-action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="reel-action-icon"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span class="reel-action-label">${Math.floor(Math.random() * 900 + 100)}</span></div>
        <div class="reel-action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="reel-action-icon"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div>
        <div class="reel-action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="reel-action-icon"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></div><div class="reel-action-item" style="margin-top:4px"><div class="reel-disc-spin">${post.avatar}</div></div>
      </div>
      ${hasVideo ? `<div class="reel-progress-track" onclick="viewerReelSeek(event,${id})"><div class="reel-progress-fill" id="reel-progress-${id}"></div></div>` : ''}
    </div>`;
  }

  function renderCarouselViewer(post) {
    const id = post.id;
    const slideIndex = Number.isInteger(post.currentSlide) ? post.currentSlide : 0;
    const dots = post.slides.map((_, i) => `<div class="dot ${i === slideIndex ? 'active' : ''}"></div>`).join('');
    const slidesHtml = post.slides.map(slide => {
      const url = typeof slide === 'object' ? slide.url : slide;
      const type = typeof slide === 'object' ? slide.type : 'image';
      return `<div class="carousel-slide">${type === 'video' ? `<video src="${url}" crossorigin="anonymous" loop playsinline ${globalMuted ? 'muted' : ''} preload="metadata"></video>` : `<img src="${url}" crossorigin="anonymous" alt="carousel">`}</div>`;
    }).join('');
    return `<div class="carousel-viewer">
      <div class="carousel-viewer-header"><div class="avatar">${post.avatar}</div><div class="post-header-info"><div class="username">${post.username}</div></div><button class="more-btn" onclick="closeViewer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="carousel-viewer-media viewer-transition-target" ontouchstart="swipeStart(event)" ontouchend="viewerSwipeEnd(event,${id})">
        <div class="carousel-track" id="viewer-track-${id}" style="transform:translateX(-${slideIndex * 100}%);">${slidesHtml}</div>
        <div class="carousel-video-play" id="carousel-video-play-${id}" onclick="viewerCarouselTogglePlay(${id})" style="display:none"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        <button class="carousel-video-mute" id="carousel-video-mute-${id}" onclick="viewerCarouselToggleMute(${id})" style="display:none">${soundIconSvg(globalMuted)}</button>
        ${post.slides.length > 1 ? `<button class="carousel-viewer-nav prev" onclick="viewerCarouselPrevSlide(${id})">‹</button><button class="carousel-viewer-nav next" onclick="viewerCarouselNextSlide(${id})">›</button><div class="carousel-viewer-dots" id="viewer-dots-${id}">${dots}</div><div class="slide-counter" id="viewer-slide-counter-${id}">${slideIndex + 1}/${post.slides.length}</div>` : ''}
      </div>
      <div class="carousel-viewer-actions"><button class="action-btn" onclick="toggleLike(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button><button class="action-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button><button class="action-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button><button class="action-btn bookmark-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button></div>
      <div class="carousel-viewer-likes">${post.likes.toLocaleString()} likes</div><div class="carousel-viewer-caption"><span class="user">${post.username}</span> ${formatCaption(post.caption || '')}</div><div class="carousel-viewer-comments"><div class="view-all">View all 24 comments</div><div class="comment"><span class="user">client_name</span> Love this! 🔥</div><div class="comment"><span class="user">teammate_1</span> Looks amazing</div></div><div class="post-timestamp">2 hours ago</div><div class="carousel-viewer-input"><div class="avatar">YB</div><input type="text" placeholder="Add a comment..."><button class="send-btn">Post</button></div>
    </div>`;
  }

  function currentViewerCarouselVideo(postId = viewerPostId) {
    const post = posts.find(p => p.id === postId);
    const track = document.getElementById(`viewer-track-${postId}`);
    if (!post || !track) return null;
    const slides = track.querySelectorAll('.carousel-slide');
    return slides[post.currentSlide || 0]?.querySelector('video') || null;
  }

  function updateViewerMuteButtons() {
    document.querySelectorAll('.reel-viewer-mute,.carousel-video-mute').forEach(btn => { btn.innerHTML = soundIconSvg(globalMuted); });
    document.querySelectorAll('.post-viewer video').forEach(video => { video.muted = globalMuted; });
  }

  function setGlobalMuted(muted) {
    globalMuted = Boolean(muted);
    updateViewerMuteButtons();
    const activePost = posts.find(item => Number(item.id) === Number(viewerPostId));
    const activeVideo = activePost?.type === 'carousel'
      ? currentViewerCarouselVideo(activePost.id)
      : document.getElementById(`viewer-reel-video-${viewerPostId}`);
    if (activeVideo && activeVideo.paused) activeVideo.play().catch(() => {});
  }

  function syncViewerCarouselMedia(postId = viewerPostId) {
    const post = posts.find(p => p.id === postId);
    const track = document.getElementById(`viewer-track-${postId}`);
    if (!post || !track) return;
    const isActive = Number(viewerPostId) === Number(postId);
    track.querySelectorAll('.carousel-slide').forEach((slideEl, index) => {
      const video = slideEl.querySelector('video');
      if (!video) return;
      video.muted = globalMuted;
      if (isActive && index === post.currentSlide) video.play().catch(() => {});
      else { video.pause(); if (index !== post.currentSlide) { try { video.currentTime = 0; } catch (_) {} } }
    });
    const overlay = document.getElementById(`carousel-video-play-${postId}`);
    const muteBtn = document.getElementById(`carousel-video-mute-${postId}`);
    const currentVideo = currentViewerCarouselVideo(postId);
    if (overlay) {
      overlay.style.display = currentVideo ? 'flex' : 'none';
      const icon = overlay.querySelector('svg');
      if (icon) icon.style.display = currentVideo?.paused ? 'block' : 'none';
    }
    if (muteBtn) { muteBtn.style.display = currentVideo ? 'flex' : 'none'; muteBtn.innerHTML = soundIconSvg(globalMuted); }
  }

  function viewerCarouselTogglePlay(postId = viewerPostId) {
    if (Date.now() - lastSwipeAt < 700) return;
    const video = currentViewerCarouselVideo(postId);
    if (!video) return;
    if (video.paused) video.play().catch(() => {}); else video.pause();
    const icon = document.querySelector(`#carousel-video-play-${postId} svg`);
    if (icon) icon.style.display = video.paused ? 'block' : 'none';
  }

  function viewerCarouselToggleMute(postId = viewerPostId) { setGlobalMuted(!globalMuted); }

  function viewerCarouselGo(postId, direction) {
    const post = posts.find(p => p.id === postId);
    if (!post || post.slides.length <= 1) return;
    post.currentSlide = (post.currentSlide + direction + post.slides.length) % post.slides.length;
    const track = document.getElementById(`viewer-track-${postId}`);
    if (track) track.style.transform = `translateX(-${post.currentSlide * 100}%)`;
    document.querySelectorAll(`#viewer-dots-${postId} .dot`).forEach((dot, index) => dot.classList.toggle('active', index === post.currentSlide));
    const counter = document.getElementById(`viewer-slide-counter-${postId}`);
    if (counter) counter.textContent = `${post.currentSlide + 1}/${post.slides.length}`;
    syncViewerCarouselMedia(postId);
  }
  function viewerCarouselNextSlide(postId = viewerPostId) { viewerCarouselGo(postId, 1); }
  function viewerCarouselPrevSlide(postId = viewerPostId) { viewerCarouselGo(postId, -1); }
  function initCarouselViewerVideo(post) { syncViewerCarouselMedia(post.id); }

  function initReelViewerVideo(post) {
    const video = document.getElementById(`viewer-reel-video-${post.id}`);
    if (!video) return;
    viewerVideoRef = video;
    video.muted = globalMuted;
    video.play().then(() => {
      const overlay = document.getElementById(`reel-play-overlay-${post.id}`);
      if (overlay) overlay.style.display = 'none';
    }).catch(() => {
      const overlay = document.getElementById(`reel-play-overlay-${post.id}`);
      if (overlay) overlay.style.display = 'flex';
    });
  }

  function viewerReelTogglePlay(postId = viewerPostId) {
    const video = document.getElementById(`viewer-reel-video-${postId}`);
    const overlay = document.getElementById(`reel-play-overlay-${postId}`);
    if (!video) return;
    if (video.paused) video.play().catch(() => {}); else video.pause();
    if (overlay) overlay.style.display = video.paused ? 'flex' : 'none';
  }
  function viewerReelToggleMute(postId = viewerPostId) { setGlobalMuted(!globalMuted); }
  function viewerReelUpdateProgress(postId = viewerPostId) {
    const video = document.getElementById(`viewer-reel-video-${postId}`);
    const fill = document.getElementById(`reel-progress-${postId}`);
    if (video && fill && Number.isFinite(video.duration) && video.duration > 0) fill.style.width = `${(video.currentTime / video.duration) * 100}%`;
  }
  function viewerReelOnEnded(postId = viewerPostId) {
    const video = document.getElementById(`viewer-reel-video-${postId}`);
    if (video) { video.currentTime = 0; video.play().catch(() => {}); }
  }
  function viewerReelSeek(event, postId = viewerPostId) {
    const video = document.getElementById(`viewer-reel-video-${postId}`);
    if (!video || !Number.isFinite(video.duration)) return;
    const rect = event.currentTarget.getBoundingClientRect();
    video.currentTime = Math.max(0, Math.min(video.duration, ((event.clientX - rect.left) / rect.width) * video.duration));
  }

  function viewerSwipeEnd(event, postId = viewerPostId) {
    const direction = swipeDirection(event);
    if (!direction) return;
    event.preventDefault();
    if (direction === 'left') viewerCarouselNextSlide(postId); else viewerCarouselPrevSlide(postId);
  }

  function activateViewerPost(postId) {
    const numericId = Number(postId);
    if (!Number.isFinite(numericId)) return;
    viewerPostId = numericId;
    document.querySelectorAll('.viewer-feed-item').forEach(item => {
      const active = Number(item.dataset.postId) === numericId;
      item.classList.toggle('active-viewer-item', active);
      item.querySelectorAll('video').forEach(video => { if (!active) video.pause(); });
    });
    const post = posts.find(item => Number(item.id) === numericId);
    if (!post) return;
    if (post.type === 'reel') initReelViewerVideo(post); else syncViewerCarouselMedia(post.id);
    updateViewerMuteButtons();
  }

  function handleViewerFeedScroll() {
    if (viewerScrollRaf) return;
    viewerScrollRaf = requestAnimationFrame(() => {
      viewerScrollRaf = 0;
      const feed = document.getElementById('viewerInner');
      if (!feed) return;
      const center = feed.getBoundingClientRect().top + feed.clientHeight / 2;
      let best = null, distance = Infinity;
      feed.querySelectorAll('.viewer-feed-item').forEach(item => {
        const rect = item.getBoundingClientRect();
        const current = Math.abs(rect.top + rect.height / 2 - center);
        if (current < distance) { distance = current; best = item; }
      });
      if (best && Number(best.dataset.postId) !== Number(viewerPostId)) activateViewerPost(best.dataset.postId);
    });
  }

  function visualUrlForPost(post) {
    if (!post) return '';
    if (post.type === 'reel') return post.thumbnail && post.thumbnail !== post.videoUrl ? post.thumbnail : '';
    const slide = post.slides?.[post.currentSlide || 0] || post.slides?.[0];
    if (typeof slide === 'object') return slide.thumbnailUrl || (slide.type === 'image' ? slide.url : '');
    return slide || '';
  }

  function makeTransitionVisual(post, sourceElement) {
    const image = sourceElement?.querySelector?.('img');
    if (image?.src) {
      const clone = document.createElement('img'); clone.src = image.src; return clone;
    }
    const video = sourceElement?.querySelector?.('video');
    if (video && video.readyState >= 2) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, video.videoWidth); canvas.height = Math.max(1, video.videoHeight);
        canvas.getContext('2d').drawImage(video, 0, 0);
        const clone = document.createElement('img'); clone.src = canvas.toDataURL('image/jpeg', .82); return clone;
      } catch (_) {}
    }
    const url = visualUrlForPost(post);
    if (url) { const clone = document.createElement('img'); clone.src = url; return clone; }
    return null;
  }

  function positionTransitionClone(clone, rect, radius = 0) {
    Object.assign(clone.style, { top:`${rect.top}px`, left:`${rect.left}px`, width:`${rect.width}px`, height:`${rect.height}px`, borderRadius:`${radius}px` });
  }

  function animateViewerOpen(sourceElement, postId) {
    if (!sourceElement || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const target = document.querySelector(`.viewer-feed-item[data-post-id="${postId}"] .viewer-transition-target`);
    const post = posts.find(item => Number(item.id) === Number(postId));
    if (!target || !post) return;
    const startRect = sourceElement.getBoundingClientRect();
    const endRect = target.getBoundingClientRect();
    if (!startRect.width || !endRect.width) return;
    const clone = makeTransitionVisual(post, sourceElement);
    if (!clone) return;
    clone.className = 'viewer-transition-clone';
    clone.style.objectFit = 'cover';
    positionTransitionClone(clone, startRect, 0);
    target.style.opacity = '0';
    document.body.appendChild(clone);
    requestAnimationFrame(() => requestAnimationFrame(() => positionTransitionClone(clone, endRect, innerWidth > 735 ? 6 : 0)));
    setTimeout(() => { target.style.opacity = ''; clone.remove(); }, 300);
  }

  function openViewer(id, sourceElement = null) {
    if (Date.now() - lastSwipeAt < 700 || viewerClosing) return;
    const post = posts.find(item => Number(item.id) === Number(id));
    if (!post) return;
    const viewerPosts = getViewerPosts();
    viewerPosts.forEach(item => { if (item.type === 'carousel') item.currentSlide = 0; });
    viewerPostId = Number(id);
    viewerOpenSource = sourceElement || document.querySelector(`.grid-cell[data-post-id="${id}"]`);

    const viewer = document.getElementById('postViewer');
    const inner = document.getElementById('viewerInner');
    inner.className = 'post-viewer-inner viewer-feed';
    inner.innerHTML = viewerPosts.map((item, index) => renderViewerFeedItem(item, index, viewerPosts.length)).join('') + (viewerPosts.length > 1 ? '<div class="viewer-neighbour-hint">Scroll for neighbouring posts</div>' : '');
    viewer.classList.add('active', 'preparing');
    document.body.style.overflow = 'hidden';
    const targetItem = inner.querySelector(`.viewer-feed-item[data-post-id="${id}"]`);
    if (targetItem) inner.scrollTop = targetItem.offsetTop;
    // Keep the first play() inside the user's tap gesture so mobile browsers can start with sound.
    activateViewerPost(id);

    requestAnimationFrame(() => {
      viewer.classList.remove('preparing');
      animateViewerOpen(viewerOpenSource, id);
    });

    if (viewerScrollHandler) inner.removeEventListener('scroll', viewerScrollHandler);
    viewerScrollHandler = handleViewerFeedScroll;
    inner.addEventListener('scroll', viewerScrollHandler, { passive:true });
  }

  function finalizeViewerClose() {
    document.querySelectorAll('#postViewer video').forEach(video => { video.pause(); video.removeAttribute('src'); try { video.load(); } catch (_) {} });
    const viewer = document.getElementById('postViewer');
    const inner = document.getElementById('viewerInner');
    if (viewerScrollHandler) inner.removeEventListener('scroll', viewerScrollHandler);
    viewerScrollHandler = null;
    inner.innerHTML = '';
    inner.className = 'post-viewer-inner';
    viewer.classList.remove('active', 'preparing', 'is-closing');
    document.body.style.overflow = '';
    viewerVideoRef = null;
    viewerCarouselVideos = {};
    viewerPostId = null;
    viewerOpenSource = null;
    viewerClosing = false;
  }

  function closeViewer() {
    if (viewerClosing || viewerPostId == null) return;
    viewerClosing = true;
    const viewer = document.getElementById('postViewer');
    const activeItem = viewer.querySelector(`.viewer-feed-item[data-post-id="${viewerPostId}"]`);
    const target = activeItem?.querySelector('.viewer-transition-target');
    const source = document.querySelector(`.grid-cell[data-post-id="${viewerPostId}"]`) || viewerOpenSource;
    const sourceRect = source?.getBoundingClientRect?.();
    const targetRect = target?.getBoundingClientRect?.();
    const sourceVisible = sourceRect && sourceRect.bottom > 0 && sourceRect.top < innerHeight && sourceRect.right > 0 && sourceRect.left < innerWidth;
    const post = posts.find(item => Number(item.id) === Number(viewerPostId));

    if (!target || !sourceVisible || !targetRect?.width || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      viewer.classList.add('is-closing');
      setTimeout(finalizeViewerClose, 210);
      return;
    }

    const clone = makeTransitionVisual(post, target);
    if (!clone) { viewer.classList.add('is-closing'); setTimeout(finalizeViewerClose, 210); return; }
    clone.className = 'viewer-transition-clone'; clone.style.objectFit = 'cover';
    positionTransitionClone(clone, targetRect, innerWidth > 735 ? 6 : 0);
    document.body.appendChild(clone);
    target.style.opacity = '0';
    viewer.classList.add('is-closing');
    requestAnimationFrame(() => requestAnimationFrame(() => positionTransitionClone(clone, sourceRect, 0)));
    setTimeout(() => { clone.remove(); finalizeViewerClose(); }, 300);
  }

  function goToSlide(post, index) {
    post.currentSlide = index;
    const track = document.getElementById(`track-${post.id}`);
    if (track) track.style.transform = `translateX(-${post.currentSlide * 100}%)`;
    const card = document.querySelector(`.post-card[data-id="${post.id}"]`);
    if (card) {
      card.querySelectorAll('.carousel-dots .dot').forEach((dot, i) => dot.classList.toggle('active', i === post.currentSlide));
      const counter = card.querySelector('.slide-counter');
      if (counter) counter.textContent = `${post.currentSlide + 1}/${post.slides.length}`;
    }
  }

  async function deletePost(id) {
    const post = posts.find(item => Number(item.id) === Number(id));
    if (!post) return;
    if (!confirm('Delete this post? This cannot be undone.')) return;

    // Database first: another device can no longer render a row whose files are gone.
    if (!post.isDemo) {
      const { error } = await supabaseClient.from('sns_posts').delete().eq('id', id);
      if (error) { alert('Could not delete the post: ' + error.message); return; }
    }

    posts = posts.filter(item => Number(item.id) !== Number(id));
    delete videoRefs[id];
    renderGallery();

    const paths = getPostStoragePaths(post);
    if (paths.length) {
      const { error: storageError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove(paths);
      if (storageError) console.warn('Post row was deleted, but some media files could not be removed:', storageError);
    }
    await refreshPostsFromCloud(true);
  }

  function getPostMediaUrls(post) {
    if (!post) return [];
    if (post.type === 'reel') return [post.videoUrl, post.thumbnail].filter(Boolean);
    return (post.slides || []).flatMap(slide => typeof slide === 'object' ? [slide.url, slide.thumbnailUrl] : [slide]).filter(Boolean);
  }

  async function handleBrokenMedia(event, postId) {
    event?.target?.closest?.('.grid-cell')?.classList.add('media-loaded');
    if (ghostChecks.has(postId)) return;
    ghostChecks.add(postId);
    try {
      const post = posts.find(item => Number(item.id) === Number(postId));
      if (!post || post.isDemo) return;
      const urls = [...new Set(getPostMediaUrls(post))];
      if (!urls.length) return;
      const statuses = await Promise.all(urls.map(async url => {
        try { const response = await fetch(url, { method:'HEAD', cache:'no-store' }); return response.status; }
        catch (_) { return 0; }
      }));
      const confirmedMissing = statuses.length && statuses.every(status => status === 400 || status === 404 || status === 410);
      if (!confirmedMissing) return;
      await supabaseClient.from('sns_posts').delete().eq('id', postId);
      posts = posts.filter(item => Number(item.id) !== Number(postId));
      renderGallery();
    } finally {
      setTimeout(() => ghostChecks.delete(postId), 5000);
    }
  }

  async function validateThumbnailImage(image, postId) {
    try {
      const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d', { willReadFrequently:true });
      ctx.drawImage(image, 0, 0, 32, 32);
      const data = ctx.getImageData(0, 0, 32, 32).data;
      let sum = 0, sumSq = 0, count = 0;
      for (let i = 0; i < data.length; i += 16) { const l = data[i] * .2126 + data[i+1] * .7152 + data[i+2] * .0722; sum += l; sumSq += l*l; count++; }
      const mean = sum / count; const variance = sumSq / count - mean * mean;
      if (mean < 5 && variance < 12) repairPostThumbnail(postId);
    } catch (_) {}
  }

  async function repairPostThumbnail(postId) {
    if (thumbnailRepairing.has(postId)) return;
    const post = posts.find(item => Number(item.id) === Number(postId));
    if (!post || post.type !== 'reel' || !post.videoUrl || post.isDemo) return;
    thumbnailRepairing.add(postId);
    try {
      const response = await fetch(post.videoUrl, { cache:'no-store' });
      if (!response.ok) return;
      const blob = await response.blob();
      const file = new File([blob], `repair-${postId}.mp4`, { type:blob.type || 'video/mp4' });
      const thumb = await createVideoThumbnail(file);
      if (!thumb) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session?.user) return;
      const path = `${session.user.id}/thumbnails/${Date.now()}-${crypto.randomUUID()}-repair.jpg`;
      await uploadBinaryToSupabase(path, thumb);
      const { data: publicData } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
      const oldPath = post.thumbnailStoragePath;
      post.thumbnail = publicData.publicUrl;
      post.thumbnailStoragePath = path;
      await savePosts();
      if (oldPath) supabaseClient.storage.from(SUPABASE_BUCKET).remove([oldPath]).catch(() => {});
      renderGallery();
    } catch (error) {
      console.warn('Automatic thumbnail repair failed:', error);
    } finally {
      thumbnailRepairing.delete(postId);
    }
  }

  async function refreshPostsFromCloud(silent = true) {
    if (!document.body.classList.contains('auth-locked') && !uploadInProgress) {
      const fresh = await loadPosts({ silent, keepCurrent:true });
      posts = fresh;
      if (!document.getElementById('postViewer').classList.contains('active')) renderGallery();
    }
  }

  function scheduleCloudRefresh() {
    clearTimeout(cloudRefreshTimer);
    cloudRefreshTimer = setTimeout(() => refreshPostsFromCloud(true), 220);
  }

  function setupRealtimeSync() {
    if (realtimeChannel || Array.isArray(window.__EXPORTED_POSTS__)) return;
    try {
      realtimeChannel = supabaseClient.channel('sns-posts-live')
        .on('postgres_changes', { event:'*', schema:'public', table:'sns_posts' }, scheduleCloudRefresh)
        .subscribe();
    } catch (error) { console.warn('Realtime sync unavailable:', error); }
  }

  function teardownRealtimeSync() {
    if (!realtimeChannel) return;
    try { supabaseClient.removeChannel(realtimeChannel); } catch (_) {}
    realtimeChannel = null;
  }

  async function applyAuthSession(session) {
    const overlay = document.getElementById('authOverlay');
    const signOut = document.getElementById('signOutBtn');
    const authUser = document.getElementById('authUser');
    if (!session?.user) {
      teardownRealtimeSync();
      document.body.classList.add('auth-locked'); overlay.classList.add('active'); signOut.style.display = 'none'; authUser.textContent = '';
      posts = []; document.getElementById('gallery').innerHTML = ''; appBooted = false; return;
    }
    document.body.classList.remove('auth-locked'); overlay.classList.remove('active'); signOut.style.display = 'inline-flex'; authUser.textContent = session.user.email || 'Signed in'; setAuthMessage('');
    if (!appBooted) {
      renderGallerySkeleton();
      posts = await loadPosts();
      renderGallery();
      appBooted = true;
    }
    setupRealtimeSync();
  }

  function revealClientNav() {
    document.getElementById('app')?.classList.remove('client-nav-hidden');
  }

  function handleClientWindowScroll() {
    if (!clientMode || document.getElementById('postViewer').classList.contains('active')) return;
    const y = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
    const delta = y - clientNavLastY;
    const app = document.getElementById('app');
    if (y < 24 || delta < -7) app?.classList.remove('client-nav-hidden');
    else if (delta > 8 && y > 72) app?.classList.add('client-nav-hidden');
    clientNavLastY = y;
  }

  function setClientMode(enabled) {
    clientMode = Boolean(enabled);
    document.getElementById('clientSwitch')?.classList.toggle('on', clientMode);
    const app = document.getElementById('app');
    app?.classList.toggle('client-view', clientMode);
    app?.classList.remove('client-nav-hidden');
    const backButton = document.getElementById('clientBackBtn');
    if (backButton) {
      backButton.classList.toggle('is-visible', clientMode);
      backButton.setAttribute('aria-hidden', clientMode ? 'false' : 'true');
    }
    clientNavLastY = window.scrollY || 0;
    renderGallery();
  }

  window.addEventListener('scroll', handleClientWindowScroll, { passive:true });
  window.addEventListener('touchstart', event => { clientTouchStartY = event.touches?.[0]?.clientY || 0; }, { passive:true });
  window.addEventListener('touchmove', event => {
    if (!clientMode) return;
    const y = event.touches?.[0]?.clientY || 0;
    if (y - clientTouchStartY > 24) revealClientNav();
  }, { passive:true });
  window.addEventListener('focus', () => { if (appBooted) scheduleCloudRefresh(); });
  window.addEventListener('pageshow', () => { if (appBooted) scheduleCloudRefresh(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && appBooted) scheduleCloudRefresh(); });


  async function initializeApp() {
    initializeTheme();
    const { data: { session } } = await supabaseClient.auth.getSession();
    await applyAuthSession(session);

    supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
      setTimeout(() => applyAuthSession(nextSession), 0);
    });
  }

  initializeApp();
</script>
